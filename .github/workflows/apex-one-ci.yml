name: APEX ONE — Production CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apex-one-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-integrity:
    name: Security & Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run security and integrity tests
        run: bun run test:security

  typecheck:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-and-integrity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run TypeScript verification
        run: bun run typecheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-and-integrity
      - typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run production build
        run: bun run build
