name: APEX ONE — Production CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apex-one-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-integrity:
    name: Security & Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run security and integrity tests
        run: bun run test:security
      - name: Run product integrity regression gate
        run: bun run test:product-integrity
      - name: Run authentication experience regression gate
        run: bun run test:auth-experience
      - name: Run Phase 3 infrastructure connection contract gate
        run: bun run test:infra-connection
      - name: Validate durable development Docker Compose configuration
        run: >-
          docker compose
          --env-file deploy/development/development.env.example
          -f deploy/development/docker-compose.infrastructure.yml
          config >/dev/null

  production-composition:
    name: Production Composition Root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Verify production provider composition
        run: bun run test:composition

  postgres-persistence:
    name: PostgreSQL Persistence Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:5432/apex_test?sslmode=disable
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run PostgreSQL durability and isolation integration tests
        run: bun run test:postgres

  transaction-repository-integrity:
    name: Transaction & Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_integrity_test
        ports:
          - 7543:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_integrity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:7543/apex_integrity_test?sslmode=disable
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run Stage 5 transaction and repository integrity tests
        run: bun run test:integrity

  evidence-provenance-integrity:
    name: Evidence & Provenance Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_evidence_test
        ports:
          - 8543:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_evidence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:8543/apex_evidence_test?sslmode=disable
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run Stage 6 evidence and provenance model/integration tests
        run: bun run test:evidence

  value-execution-lifecycle:
    name: Value & Execution Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_lifecycle_test
        ports:
          - 9543:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:9543/apex_lifecycle_test?sslmode=disable
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run Stage 7 value and execution lifecycle tests
        run: bun run test:lifecycle

  redis-auth-state:
    name: Redis Authentication State Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run Redis session and rate-limit integration tests
        run: bun run test:redis

  s3-document-storage:
    name: S3 Document Storage Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_documents_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_documents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:55432/apex_documents_test?sslmode=disable
      S3_ENDPOINT: http://127.0.0.1:4566
      S3_BUCKET: apex-ci-documents
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      DOCUMENT_STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run S3-compatible encrypted document-storage integration tests
        run: bun run test:s3

  postgres-search-index:
    name: PostgreSQL Document Search Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_search_test
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_search_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:65432/apex_search_test?sslmode=disable
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run durable PostgreSQL document-search integration tests
        run: bun run test:search

  durability-recovery:
    name: Durability & Recovery Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:5432/apex_recovery_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      S3_ENDPOINT: http://127.0.0.1:4566
      S3_BUCKET: apex-ci-recovery-documents
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      DOCUMENT_STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      TEST_ENV: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run Stage 4G durability and recovery assurance
        run: bun run test:recovery
      - name: Prove durable state survives a fresh application process
        env:
          APP_ENV: assurance
          APEX_DATABASE_ADAPTER: postgres
          APEX_SESSION_ADAPTER: redis
          APEX_RATE_LIMIT_ADAPTER: redis
          APEX_AUDIT_ADAPTER: postgres
          APEX_OBJECT_STORAGE_ADAPTER: s3
          APEX_SEARCH_INDEX_ADAPTER: postgres
        run: bun run test:restart-persistence

  typecheck:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-and-integrity
      - production-composition
      - postgres-persistence
      - transaction-repository-integrity
      - evidence-provenance-integrity
      - value-execution-lifecycle
      - redis-auth-state
      - s3-document-storage
      - postgres-search-index
      - durability-recovery
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run TypeScript verification
        run: bun run typecheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-and-integrity
      - production-composition
      - postgres-persistence
      - transaction-repository-integrity
      - evidence-provenance-integrity
      - value-execution-lifecycle
      - redis-auth-state
      - s3-document-storage
      - postgres-search-index
      - durability-recovery
      - typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run production build
        run: bun run build
