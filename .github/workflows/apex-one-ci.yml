name: APEX ONE — Production CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apex-one-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-integrity:
    name: Security & Integrity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run security and integrity tests
        run: bun run test:security

  postgres-persistence:
    name: PostgreSQL Persistence Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:5432/apex_test?sslmode=disable
      TEST_ENV: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run PostgreSQL durability and isolation integration tests
        run: bun run test:postgres

  typecheck:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-and-integrity
      - postgres-persistence

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run TypeScript verification
        run: bun run typecheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - security-and-integrity
      - postgres-persistence
      - typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run production build
        run: bun run build
