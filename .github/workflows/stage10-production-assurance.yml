name: APEX ONE — Stage 10 Production Assurance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apex-one-stage10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-assurance:
    name: HTTP / Browser / Fault / Recovery Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci-password
          POSTGRES_DB: apex_stage10_test
        ports:
          - 11543:5432
        options: >-
          --health-cmd "pg_isready -U apex -d apex_stage10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 11679:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:3.8.1
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 14566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: assurance
      TEST_ENV: "true"
      APEX_DATABASE_ADAPTER: postgres
      APEX_SESSION_ADAPTER: redis
      APEX_RATE_LIMIT_ADAPTER: redis
      APEX_AUDIT_ADAPTER: postgres
      APEX_OBJECT_STORAGE_ADAPTER: s3
      APEX_SEARCH_INDEX_ADAPTER: postgres
      DATABASE_URL: postgres://apex:apex-ci-password@127.0.0.1:11543/apex_stage10_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:11679/0
      S3_ENDPOINT: http://127.0.0.1:14566
      S3_BUCKET: apex-stage10-documents
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      DOCUMENT_STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      ASSURANCE_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build production standalone application
        run: bun run build
      - name: Prepare synthetic durable assurance fixtures
        run: bun run assurance:prepare
      - name: Start production-built standalone HTTP server
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
          HOSTNAME=0.0.0.0 PORT=3000 nohup node .next/standalone/server.js > /tmp/apex-stage10-server.log 2>&1 &
          echo $! > /tmp/apex-stage10-server.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/apex-stage10-server.log
          exit 1
      - name: Require initial durable readiness
        run: ./node_modules/.bin/tsx scripts/assertProductionReadiness.ts ready
      - name: Run built-server HTTP, AI grounding, and concurrency assurance
        run: bun run test:assurance:http
      - name: Inject Redis outage and prove fail-closed recovery
        run: |
          id=$(docker ps --filter ancestor=redis:7-alpine --format '{{.ID}}' | head -n 1)
          test -n "$id"
          docker stop "$id"
          ./node_modules/.bin/tsx scripts/assertProductionReadiness.ts not_ready
          docker start "$id"
          ./node_modules/.bin/tsx scripts/assertProductionReadiness.ts ready
      - name: Inject PostgreSQL outage and prove fail-closed recovery
        run: |
          id=$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -n 1)
          test -n "$id"
          docker stop "$id"
          ./node_modules/.bin/tsx scripts/assertProductionReadiness.ts not_ready
          docker start "$id"
          ./node_modules/.bin/tsx scripts/assertProductionReadiness.ts ready
      - name: Inject object-storage outage and prove fail-closed recovery
        run: |
          id=$(docker ps --filter ancestor=localstack/localstack:3.8.1 --format '{{.ID}}' | head -n 1)
          test -n "$id"
          docker stop "$id"
          ./node_modules/.bin/tsx scripts/assertProductionReadiness.ts not_ready
          docker start "$id"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:14566/_localstack/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:14566/_localstack/health >/dev/null
          bun run assurance:restore-storage
          ./node_modules/.bin/tsx scripts/assertProductionReadiness.ts ready
      - name: Install pinned Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run real-browser authentication and RBAC assurance
        run: node scripts/runBrowserAuthRbacAssurance.mjs
      - name: Require clean standalone image runtime
        run: |
          if grep -E -q "sharp' is required|sharp-missing-in-production" /tmp/apex-stage10-server.log; then
            cat /tmp/apex-stage10-server.log
            exit 1
          fi
      - name: Dump production server log
        if: always()
        run: cat /tmp/apex-stage10-server.log || true

  deployment-image:
    name: Deployment Image / Fail-Closed Startup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build standalone production image
        run: docker build --pull --tag apex-one-stage10:ci .
      - name: Boot intentionally unconfigured production image
        run: |
          docker run -d --name apex-stage10-deployment -p 3100:3000 -e APP_ENV=production apex-one-stage10:ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:3100/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs apex-stage10-deployment
          exit 1
      - name: Verify liveness, readiness, and fail-closed traffic contract
        run: |
          test "$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://localhost:3100/api/v1/health/ready)" = "503"
          grep -q '"status":"not_ready"' /tmp/ready.json
          test "$(curl -sS -o /tmp/customers.json -w '%{http_code}' http://localhost:3100/api/v1/customers)" = "503"
          grep -q 'INFRASTRUCTURE_NOT_READY' /tmp/customers.json
          test "$(docker inspect -f '{{.Config.User}}' apex-stage10-deployment)" = "node"
          docker inspect -f '{{json .Config.Healthcheck}}' apex-stage10-deployment | grep -q 'api/v1/health'
      - name: Dump deployment container log
        if: always()
        run: |
          docker logs apex-stage10-deployment || true
          docker rm -f apex-stage10-deployment || true

  stage10-typecheck:
    name: Stage 10 TypeScript Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - runtime-assurance
      - deployment-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run TypeScript verification
        run: bun run typecheck

  stage10-build:
    name: Stage 10 Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - runtime-assurance
      - deployment-image
      - stage10-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run production build
        run: bun run build
