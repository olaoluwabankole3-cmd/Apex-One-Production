name: APEX ONE — Stage 10 Production Assurance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apex-one-stage10-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-refresh:
    name: Commit Stage 10 Sharp Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Stage 10 head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Generate pinned standalone image dependency lock
        run: bun add --exact sharp@0.35.4
      - name: Commit generated package and lockfile
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Sharp dependency is already locked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "fix: include sharp in standalone production runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
